[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fhir-verifiable-credentials"
version = "0.1.0"
description = "Convert HL7 FHIR resources into W3C Verifiable Credentials for patient-owned health data."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Big Data Plumbing", email = "contact@bigdataplumbing.io"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "cryptography>=41.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
]

[project.scripts]
fhir-vc = "fhir_vc.cli.main:app"

[project.urls]
Homepage = "https://github.com/bigdataplumbing/fhir-verifiable-credentials"
Documentation = "https://github.com/bigdataplumbing/fhir-verifiable-credentials#readme"
Repository = "https://github.com/bigdataplumbing/fhir-verifiable-credentials"
Issues = "https://github.com/bigdataplumbing/fhir-verifiable-credentials/issues"

[tool.hatch.build.targets.wheel]
packages = ["fhir_vc"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
strict = true

